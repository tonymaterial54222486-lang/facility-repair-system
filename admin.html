<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廠務報修管理</title>
<style>
  :root{
    --primary:#0f6e56; --primary-dark:#085041; --bg:#f4f3ef; --card:#ffffff;
    --border:#d8d5cc; --text:#2c2c2a; --muted:#6b6a64; --danger:#a32d2d; --amber:#854f0b; --amber-bg:#faeeda;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text);}
  .wrap{max-width:600px; margin:0 auto; min-height:100vh; background:var(--bg);}
  header{background:var(--primary-dark); color:#fff; padding:18px 20px; position:sticky; top:0; z-index:10;}
  header h1{margin:0; font-size:18px; font-weight:500;}
  .gate{padding:60px 24px; text-align:center; background:#fff;}
  .gate input{width:100%; text-align:center; letter-spacing:8px; font-size:22px; padding:12px; border:1px solid var(--border); border-radius:8px;}
  .gate button, .toolbar button, .card button{
    background:var(--primary); color:#fff; border:none; border-radius:8px; padding:12px 20px;
    font-size:15px; font-weight:500; cursor:pointer;
  }
  .gate button{width:100%; margin-top:16px;}
  .err{color:var(--danger); font-size:13px; margin-top:8px; display:none;}
  .toolbar{display:flex; gap:10px; padding:14px 16px; background:#fff; border-bottom:1px solid var(--border);
    position:sticky; top:56px; z-index:9; flex-wrap:wrap;}
  select{padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:#fff; flex:1; min-width:120px;}
  .summary{padding:10px 16px; font-size:13px; color:var(--muted);}
  .list{padding:0 16px 40px;}
  .card{background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:12px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-title{font-size:15px; font-weight:500;}
  .card-meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 10px; border-radius:20px; white-space:nowrap;}
  .badge .dot{width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block; flex-shrink:0;}
  .badge.urgent{background:#fcebeb; color:var(--danger);}
  .badge.red{background:#fcebeb; color:var(--danger);}
  .badge.orange{background:var(--amber-bg); color:var(--amber);}
  .badge.blue{background:#e6f1fb; color:#0c447c;}
  .card-desc{font-size:14px; margin:10px 0; line-height:1.5;}
  .card-photo{max-width:100%; border-radius:8px; margin:8px 0; max-height:200px; object-fit:cover;}
  .edit-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .edit-row.full{grid-template-columns:1fr;}
  .edit-row label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px;}
  .edit-row select, .edit-row input, .edit-row textarea{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; font-family:inherit;
  }
  .save-btn{margin-top:12px; width:100%;}
  .empty{padding:40px 20px; text-align:center; color:var(--muted); font-size:14px;}
  .hidden{display:none !important;}
  .loading-overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:100;}
  .spinner{width:36px; height:36px; border:4px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .saved-tip{font-size:12px; color:var(--primary-dark); margin-top:6px; display:none;}
</style>
</head>
<body>
<div class="wrap">

  <header><h1>廠務報修管理</h1></header>

  <div id="gate" class="gate">
    <p style="color:var(--muted); font-size:14px;">請輸入廠務密碼</p>
    <input type="password" id="pw-input" inputmode="numeric" maxlength="8" placeholder="••••">
    <div class="err" id="pw-err">密碼錯誤，請重新輸入</div>
    <button id="pw-submit">登入</button>
  </div>

  <div id="main" class="hidden">
    <div class="toolbar">
      <select id="status-filter">
        <option value="open">全部未處理完成</option>
        <option value="all">全部</option>
        <option value="非廠務權責">非廠務權責</option>
        <option value="處理中">處理中</option>
        <option value="委外處理">委外處理</option>
        <option value="其它_評估中">其它_評估中</option>
      </select>
      <button id="refresh-btn">重新整理</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="list" id="list"></div>
  </div>

</div>

<div id="loading" class="loading-overlay hidden"><div class="spinner"></div></div>

<script>
// ====== 設定區：請填入您的 GAS Web App 網址（與 index.html 相同） ======
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxtsKnH11neW87AxVwNXgcBMu8e-e2Kebf45_uf3CRja42gC2TV5m9V3CaBru2lhkTm/exec';
// =======================================================================

let facilityPassword = '';
let allRecords = [];

function el(id){ return document.getElementById(id); }
function showLoading(v){ el('loading').classList.toggle('hidden', !v); }

el('pw-submit').addEventListener('click', () => {
  const pw = el('pw-input').value.trim();
  if (!pw) return;
  showLoading(true);
  fetch(GAS_URL + '?action=list&password=' + encodeURIComponent(pw) + '&days=30')
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        facilityPassword = pw;
        el('gate').classList.add('hidden');
        el('main').classList.remove('hidden');
        allRecords = res.records;
        renderList();
      } else {
        el('pw-err').style.display = 'block';
      }
    })
    .catch(() => { el('pw-err').textContent = '連線失敗，請確認網路'; el('pw-err').style.display = 'block'; })
    .finally(() => showLoading(false));
});
el('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') el('pw-submit').click(); });

el('refresh-btn').addEventListener('click', loadRecords);
el('status-filter').addEventListener('change', renderList);

function loadRecords(){
  showLoading(true);
  fetch(GAS_URL + '?action=list&password=' + encodeURIComponent(facilityPassword) + '&days=30')
    .then(r => r.json())
    .then(res => {
      if (res.success) { allRecords = res.records; renderList(); }
    })
    .finally(() => showLoading(false));
}

// 燈號分類：藍=已結案（處理完成/其它_結案/非廠務權責）、紅=未處理（尚未指派）、橘=其餘（處理中中）
const BLUE_STATUSES = ['處理完成', '其它_結案', '非廠務權責'];
function statusCategory(progress){
  if (!progress) return 'red';
  if (BLUE_STATUSES.includes(progress)) return 'blue';
  return 'orange';
}

function renderList(){
  const filter = el('status-filter').value;
  let filtered = allRecords;
  if (filter === 'open') {
    filtered = allRecords.filter(r => statusCategory(r.progress) !== 'blue');
  } else if (filter !== 'all') {
    filtered = allRecords.filter(r => r.progress === filter);
  }

  el('summary').textContent = '共 ' + filtered.length + ' 筆（近30天）';

  const listEl = el('list');
  listEl.innerHTML = '';
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty">目前沒有符合條件的工單</div>';
    return;
  }

  filtered.forEach(r => {
    const cat = statusCategory(r.progress);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-title">${r.floor} ${r.area} ${r.item}</div>
          <div class="card-meta">${r.date} ${r.time} · ${r.reporter}（${r.empId || '-'}）${r.dept ? ' · ' + r.dept : ''}</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
          ${r.urgent === '是' ? '<span class="badge urgent"><span class="dot"></span>緊急</span>' : ''}
          <span class="badge ${cat}"><span class="dot"></span>${r.progress || '未處理'}</span>
        </div>
      </div>
      <div class="card-desc">${escapeHtml(r.description)}</div>
      ${r.photo ? '<img class="card-photo" src="' + r.photo + '">' : ''}
      <div class="edit-row">
        <div>
          <label>維修進度</label>
          <select class="f-progress">
            <option value="">未指派</option>
            <option value="非廠務權責">非廠務權責</option>
            <option value="處理中">處理中</option>
            <option value="委外處理">委外處理</option>
            <option value="處理完成">處理完成</option>
            <option value="其它_評估中">其它_評估中</option>
            <option value="其它_結案">其它_結案</option>
          </select>
        </div>
        <div>
          <label>維修人員</label>
          <input type="text" class="f-tech" value="${escapeAttr(r.technician)}">
        </div>
      </div>
      <div class="edit-row full">
        <div>
          <label>備註</label>
          <textarea class="f-note" rows="2">${escapeHtml(r.note)}</textarea>
        </div>
      </div>
      <button class="save-btn f-save">更新此筆</button>
      <div class="saved-tip">已更新</div>
    `;
    card.querySelector('.f-progress').value = r.progress || '';
    card.querySelector('.f-save').addEventListener('click', () => saveUpdate(r.id, card));
    listEl.appendChild(card);
  });
}

function saveUpdate(id, card){
  const progress = card.querySelector('.f-progress').value;
  const technician = card.querySelector('.f-tech').value.trim();
  const note = card.querySelector('.f-note').value.trim();

  showLoading(true);
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'update', id, progress, technician, note, password: facilityPassword })
  })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        const tip = card.querySelector('.saved-tip');
        tip.style.display = 'block';
        setTimeout(() => { tip.style.display = 'none'; }, 2000);
        loadRecords();
      } else {
        alert(res.error || '更新失敗');
      }
    })
    .catch(() => alert('連線失敗，請重試'))
    .finally(() => showLoading(false));
}

function escapeHtml(s){
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
</script>
</body>
</html>

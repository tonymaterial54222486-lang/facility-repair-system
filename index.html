<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廠務行動化報修</title>
<style>
  :root{
    --primary:#0f6e56; --primary-dark:#085041; --bg:#f4f3ef; --card:#ffffff;
    --border:#d8d5cc; --text:#2c2c2a; --muted:#6b6a64; --danger:#a32d2d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:480px; margin:0 auto; min-height:100vh; background:var(--card); box-shadow:0 0 24px rgba(0,0,0,.06);}
  header{background:var(--primary-dark); color:#fff; padding:18px 20px; position:sticky; top:0; z-index:10;}
  header h1{margin:0; font-size:18px; font-weight:500;}
  header p{margin:4px 0 0; font-size:12px; opacity:.85;}
  .content{padding:20px;}
  .field{margin-bottom:18px;}
  label{display:block; font-size:13px; font-weight:500; color:var(--muted); margin-bottom:6px;}
  input[type=text], input[type=password], input[type=tel], select, textarea{
    width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px;
    font-size:16px; background:#fff; color:var(--text); font-family:inherit;
  }
  textarea{min-height:90px; resize:vertical;}
  select{appearance:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%236b6a64" stroke-width="1.5" fill="none"/></svg>'); background-repeat:no-repeat; background-position:right 14px center;}
  .locked-badge{
    display:inline-flex; align-items:center; gap:6px; background:#e1f5ee; color:var(--primary-dark);
    border:1px solid #9fe1cb; padding:10px 14px; border-radius:8px; font-size:15px; font-weight:500; width:100%;
  }
  .row-2{display:flex; gap:12px;}
  .row-2 > div{flex:1;}
  .desc-wrap{position:relative;}
  .mic-btn{
    position:absolute; right:8px; bottom:8px; width:38px; height:38px; border-radius:50%;
    border:none; background:var(--primary); color:#fff; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .mic-btn.listening{background:var(--danger); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
  .photo-area{
    border:2px dashed var(--border); border-radius:10px; padding:20px; text-align:center; cursor:pointer;
  }
  .photo-area span{font-size:13px; color:var(--muted);}
  .photo-preview{width:100%; margin-top:12px; border-radius:8px; display:none; max-height:220px; object-fit:cover;}
  .checkbox-row{display:flex; align-items:center; gap:8px;}
  .checkbox-row input{width:18px; height:18px;}
  .checkbox-row label{margin:0;}
  button.submit{
    width:100%; padding:15px; background:var(--primary); color:#fff; border:none; border-radius:8px;
    font-size:16px; font-weight:500; cursor:pointer; margin-top:8px;
  }
  button.submit:disabled{background:var(--border); color:var(--muted);}
  .gate{padding:60px 24px; text-align:center;}
  .gate input{text-align:center; letter-spacing:8px; font-size:22px;}
  .gate button{margin-top:16px;}
  .err{color:var(--danger); font-size:13px; margin-top:8px; display:none;}
  .success{padding:60px 24px; text-align:center;}
  .success .icon{width:64px; height:64px; border-radius:50%; background:#e1f5ee; color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:32px;}
  .success h2{font-size:18px; margin-bottom:8px;}
  .success p{color:var(--muted); font-size:14px; line-height:1.6;}
  .again-btn{margin-top:24px; background:none; border:1px solid var(--primary); color:var(--primary);
    padding:10px 20px; border-radius:8px; font-size:14px; cursor:pointer;}
  .hidden{display:none !important;}
  .loading-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:100;
  }
  .spinner{width:36px; height:36px; border:4px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>廠務行動化報修</h1>
    <p id="header-sub">請確實填寫報修內容</p>
  </header>

  <!-- 密碼登入畫面 -->
  <div id="gate" class="gate">
    <p style="color:var(--muted); font-size:14px;">請輸入通行密碼</p>
    <input type="password" id="pw-input" inputmode="numeric" maxlength="4" placeholder="••••">
    <div class="err" id="pw-err">密碼錯誤，請重新輸入</div>
    <button class="submit" id="pw-submit" style="margin-top:16px;">進入系統</button>
  </div>

  <!-- 報修表單 -->
  <div id="form-screen" class="content hidden">

    <div class="field" id="floor-field">
      <label>樓層</label>
      <select id="floor-select"></select>
    </div>

    <div class="field" id="area-field">
      <label>區域</label>
      <select id="area-select"></select>
    </div>

    <div class="field" id="item-field">
      <label>項目</label>
      <select id="item-select"></select>
    </div>

    <div class="field">
      <label>異常說明</label>
      <div class="desc-wrap">
        <textarea id="description" placeholder="請描述異常情形，或點右下角麥克風語音輸入"></textarea>
        <button type="button" class="mic-btn" id="mic-btn" title="語音輸入">🎤</button>
      </div>
    </div>

    <div class="field">
      <label>現場照片（選填）</label>
      <div class="photo-area" id="photo-area">
        <span id="photo-hint">點此拍照或上傳圖片</span>
      </div>
      <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden">
      <img id="photo-preview" class="photo-preview">
    </div>

    <div class="row-2">
      <div class="field">
        <label>工號</label>
        <input type="text" id="emp-id" inputmode="numeric" placeholder="輸入工號自動帶入姓名">
      </div>
      <div class="field">
        <label>報修人</label>
        <input type="text" id="reporter-name" placeholder="可手動填寫">
      </div>
    </div>

    <div class="field checkbox-row">
      <input type="checkbox" id="urgent-check">
      <label for="urgent-check">緊急案件（已電話通報廠務，此為事後補登）</label>
    </div>

    <div class="err" id="submit-err"></div>
    <button class="submit" id="submit-btn">送出報修</button>
  </div>

  <!-- 送出成功畫面 -->
  <div id="success-screen" class="success hidden">
    <div class="icon">✓</div>
    <h2>報修已送出</h2>
    <p>廠務已收到通知，處理進度可隨時回本系統查詢。</p>
    <button class="again-btn" id="again-btn">再填一筆</button>
  </div>

</div>

<div id="loading" class="loading-overlay hidden"><div class="spinner"></div></div>

<script>
// ====== 設定區：部署後請填入您的 GAS Web App網址 ======
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxtsKnH11neW87AxVwNXgcBMu8e-e2Kebf45_uf3CRja42gC2TV5m9V3CaBru2lhkTm/exec';
const GENERAL_PASSWORD = '0000';
// =====================================================

let config = { floors: [], areas: [], items: [], employees: {} };
let compressedPhotoBase64 = '';

const qs = new URLSearchParams(location.search);
const presetFloor = qs.get('floor');
const presetArea = qs.get('area');
const presetItem = qs.get('item');

function el(id){ return document.getElementById(id); }
function showLoading(show){ el('loading').classList.toggle('hidden', !show); }

// ---------- 密碼閘門 ----------
el('pw-submit').addEventListener('click', () => {
  const val = el('pw-input').value.trim();
  if (val === GENERAL_PASSWORD) {
    el('gate').classList.add('hidden');
    el('form-screen').classList.remove('hidden');
    loadConfig();
  } else {
    el('pw-err').style.display = 'block';
  }
});
el('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') el('pw-submit').click(); });

// ---------- 載入設定（樓層/區域/項目/員工對照表） ----------
function loadConfig(){
  showLoading(true);
  fetch(GAS_URL + '?action=config')
    .then(r => r.json())
    .then(data => {
      config = data;
      fillSelect('floor-select', config.floors, presetFloor);
      fillSelect('area-select', config.areas, presetArea);
      fillSelect('item-select', config.items, presetItem);
    })
    .catch(() => {
      el('submit-err').textContent = '設定載入失敗，樓層/區域/項目請手動確認後再送出';
      el('submit-err').style.display = 'block';
    })
    .finally(() => showLoading(false));
}

function fillSelect(id, list, preset){
  const sel = el(id);
  sel.innerHTML = '';
  (list || []).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
  if (preset && list && list.includes(preset)) sel.value = preset;
}

// ---------- 工號自動帶入姓名 ----------
el('emp-id').addEventListener('input', () => {
  const id = el('emp-id').value.trim();
  if (config.employees && config.employees[id]) {
    el('reporter-name').value = config.employees[id];
  }
});

// ---------- 語音輸入 ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = el('mic-btn');
if (!SpeechRecognition) {
  micBtn.style.display = 'none';
} else {
  const recognition = new SpeechRecognition();
  recognition.lang = 'zh-TW';
  recognition.continuous = false;
  recognition.interimResults = false;
  let listening = false;

  micBtn.addEventListener('click', () => {
    if (listening) { recognition.stop(); return; }
    recognition.start();
  });
  recognition.onstart = () => { listening = true; micBtn.classList.add('listening'); };
  recognition.onend = () => { listening = false; micBtn.classList.remove('listening'); };
  recognition.onerror = () => { listening = false; micBtn.classList.remove('listening'); };
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    const ta = el('description');
    ta.value = ta.value ? (ta.value + ' ' + text) : text;
  };
}

// ---------- 照片選取與壓縮 ----------
el('photo-area').addEventListener('click', () => el('photo-input').click());
el('photo-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1000;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      compressedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
      el('photo-preview').src = compressedPhotoBase64;
      el('photo-preview').style.display = 'block';
      el('photo-hint').textContent = '已選擇照片，點此可重新選擇';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// ---------- 送出 ----------
el('submit-btn').addEventListener('click', () => {
  const payload = {
    action: 'create',
    floor: el('floor-select').value,
    area: el('area-select').value,
    item: el('item-select').value,
    description: el('description').value.trim(),
    empId: el('emp-id').value.trim(),
    reporterName: el('reporter-name').value.trim(),
    urgent: el('urgent-check').checked,
    photoBase64: compressedPhotoBase64
  };

  if (!payload.description) {
    el('submit-err').textContent = '請填寫異常說明';
    el('submit-err').style.display = 'block';
    return;
  }
  if (!payload.reporterName) {
    el('submit-err').textContent = '請填寫報修人姓名或輸入工號';
    el('submit-err').style.display = 'block';
    return;
  }
  el('submit-err').style.display = 'none';

  showLoading(true);
  el('submit-btn').disabled = true;

  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        el('form-screen').classList.add('hidden');
        el('success-screen').classList.remove('hidden');
      } else {
        throw new Error(res.error || '送出失敗');
      }
    })
    .catch(err => {
      el('submit-err').textContent = '送出失敗，請確認網路連線後重試（' + err.message + '）';
      el('submit-err').style.display = 'block';
    })
    .finally(() => {
      showLoading(false);
      el('submit-btn').disabled = false;
    });
});

el('again-btn').addEventListener('click', () => {
  el('description').value = '';
  el('emp-id').value = '';
  el('reporter-name').value = '';
  el('urgent-check').checked = false;
  compressedPhotoBase64 = '';
  el('photo-preview').style.display = 'none';
  el('photo-hint').textContent = '點此拍照或上傳圖片';
  el('success-screen').classList.add('hidden');
  el('form-screen').classList.remove('hidden');
});
</script>
</body>
</html>

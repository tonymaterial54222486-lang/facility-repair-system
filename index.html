<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廠務行動化報修</title>
<style>
:root{
  --primary:#0f6e56; --primary-dark:#085041; --bg:#f4f3ef; --card:#fff;
  --border:#d8d5cc; --text:#2c2c2a; --muted:#6b6a64; --danger:#a32d2d;
  --amber:#854f0b; --amber-bg:#faeeda; --blue:#0c447c; --blue-bg:#e6f1fb;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;}
.wrap{max-width:480px; margin:0 auto; min-height:100vh; background:var(--card); box-shadow:0 0 24px rgba(0,0,0,.06);}

/* header */
header{background:var(--primary-dark); color:#fff; padding:18px 20px; position:sticky; top:0; z-index:10;}
header h1{margin:0; font-size:18px; font-weight:500;}
header p{margin:4px 0 0; font-size:12px; opacity:.8;}

/* 通用元件 */
.content{padding:20px;}
.field{margin-bottom:16px;}
label.lbl{display:block; font-size:13px; font-weight:500; color:var(--muted); margin-bottom:5px;}
input[type=text],input[type=password],input[type=tel],select,textarea{
  width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px;
  font-size:16px; background:#fff; color:var(--text); font-family:inherit; appearance:none;}
textarea{min-height:80px; resize:vertical;}
select{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%236b6a64" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>');
  background-repeat:no-repeat; background-position:right 14px center; padding-right:36px;}
.hint{font-size:12px; color:var(--muted); margin-top:4px;}
.row2{display:flex; gap:12px;}
.row2>div{flex:1;}
.btn{width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:8px;
  font-size:16px; font-weight:500; cursor:pointer; margin-top:4px;}
.btn:disabled{background:var(--border); color:var(--muted);}
.btn-outline{background:none; border:1.5px solid var(--primary); color:var(--primary);}
.err{color:var(--danger); font-size:13px; margin-top:6px; display:none;}
.hidden{display:none !important;}

/* 首頁選單 */
.home-wrap{padding:40px 24px;}
.home-wrap h2{font-size:20px; font-weight:600; margin:0 0 8px; text-align:center;}
.home-wrap p{color:var(--muted); font-size:14px; text-align:center; margin:0 0 32px;}
.home-card{display:flex; align-items:center; gap:16px; padding:20px; border:1.5px solid var(--border);
  border-radius:12px; margin-bottom:14px; cursor:pointer; background:#fff;}
.home-card:active{background:var(--bg);}
.home-card .icon{width:52px; height:52px; border-radius:12px; display:flex; align-items:center;
  justify-content:center; font-size:26px; flex-shrink:0;}
.home-card.repair .icon{background:#e1f5ee;}
.home-card.query .icon{background:var(--blue-bg);}
.home-card .info h3{margin:0 0 4px; font-size:16px; font-weight:500;}
.home-card .info p{margin:0; font-size:13px; color:var(--muted);}

/* 進度查詢 - 登入 */
.login-wrap{padding:48px 24px 24px;}
.login-wrap h2{font-size:18px; font-weight:500; margin:0 0 6px;}
.login-wrap p{color:var(--muted); font-size:13px; margin:0 0 24px;}

/* 進度查詢 - 工單列表 */
.toolbar{display:flex; gap:8px; padding:12px 16px; background:#fff;
  border-bottom:1px solid var(--border); position:sticky; top:56px; z-index:9; flex-wrap:wrap;}
.toolbar select{flex:1; min-width:100px; padding:8px 10px; font-size:13px;}
.toolbar .refresh{padding:8px 14px; background:var(--primary); color:#fff; border:none;
  border-radius:8px; font-size:13px; cursor:pointer; white-space:nowrap;}
.summary{padding:8px 16px; font-size:12px; color:var(--muted); background:#fafaf9;}
.list-wrap{padding:12px 16px 40px;}

/* 工單卡片 */
.card{background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px;}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px;}
.card-title{font-size:15px; font-weight:500;}
.card-meta{font-size:12px; color:var(--muted); margin-top:2px;}
.badges{display:flex; flex-direction:column; gap:4px; align-items:flex-end; flex-shrink:0;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 10px;
  border-radius:20px; white-space:nowrap;}
.badge .dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0;}
.badge.red{background:#fcebeb; color:var(--danger);}
.badge.orange{background:var(--amber-bg); color:var(--amber);}
.badge.blue{background:var(--blue-bg); color:var(--blue);}
.card-desc{font-size:13px; color:var(--text); margin-bottom:8px; line-height:1.5;}
.photos{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
.photos a img{width:70px; height:70px; object-fit:cover; border-radius:6px; border:1px solid var(--border);}
.card-detail{font-size:12px; color:var(--muted); line-height:1.8;}

/* 廠務編輯區塊 */
.edit-block{margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
.edit-row{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
.edit-row.full{grid-template-columns:1fr;}
.edit-row label{font-size:12px; color:var(--muted); display:block; margin-bottom:3px;}
.edit-row select,.edit-row input,.edit-row textarea{
  width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px;
  font-size:14px; font-family:inherit;}
.edit-actions{display:flex; gap:8px; margin-top:8px;}
.edit-actions button{flex:1; padding:10px; border:none; border-radius:8px; font-size:14px; cursor:pointer; font-weight:500;}
.save-btn{background:var(--primary); color:#fff;}
.del-btn{background:#fcebeb; color:var(--danger);}
.saved-tip{font-size:12px; color:var(--primary-dark); margin-top:6px; display:none; text-align:center;}

/* 照片上傳 */
.photo-upload-wrap{display:flex; gap:8px; flex-wrap:wrap;}
.photo-slot{width:88px; height:88px; border:2px dashed var(--border); border-radius:8px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden;}
.photo-slot img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
.photo-slot .plus{font-size:28px; color:var(--muted); position:relative;}
.photo-slot .rm{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.5); color:#fff;
  border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer;
  display:none; align-items:center; justify-content:center; z-index:2;}
.photo-slot.has-photo .rm{display:flex;}

/* 成功畫面 */
.success-wrap{padding:60px 24px; text-align:center;}
.success-icon{width:64px; height:64px; border-radius:50%; background:#e1f5ee; color:var(--primary-dark);
  font-size:30px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
.success-wrap h2{font-size:18px; margin:0 0 8px;}
.success-wrap p{color:var(--muted); font-size:14px; margin:0 0 24px;}

/* loading */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex;
  align-items:center; justify-content:center; z-index:100;}
.spinner{width:36px; height:36px; border:4px solid #fff; border-top-color:transparent;
  border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{padding:40px 20px; text-align:center; color:var(--muted); font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="header-title">廠務行動化報修</h1>
    <p id="header-sub">東立材料股份有限公司</p>
  </header>

  <!-- ① 首頁 -->
  <div id="screen-home" class="home-wrap">
    <h2>請選擇功能</h2>
    <p>廠務行動化報修系統</p>
    <div class="home-card repair" onclick="gotoRepair()">
      <div class="icon">🔧</div>
      <div class="info">
        <h3>廠務報修</h3>
        <p>填寫異常狀況，送出報修申請</p>
      </div>
    </div>
    <div class="home-card query" onclick="gotoQuery()">
      <div class="icon">📋</div>
      <div class="info">
        <h3>報修進度查看</h3>
        <p>輸入工號查詢個人或部門報修紀錄</p>
      </div>
    </div>
  </div>

  <!-- ② 報修 - 登入 -->
  <div id="screen-repair-login" class="content hidden">
    <div class="field">
      <label class="lbl">工號</label>
      <input type="tel" id="r-empid" placeholder="請輸入工號" maxlength="20">
      <div class="hint">輸入工號可自動帶入姓名</div>
    </div>
    <div class="field">
      <label class="lbl">姓名</label>
      <input type="text" id="r-name" placeholder="可手動輸入">
    </div>
    <div class="err" id="r-login-err"></div>
    <button class="btn" onclick="repairNext()">下一步</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="goHome()">返回</button>
  </div>

  <!-- ③ 報修 - 表單 -->
  <div id="screen-repair-form" class="content hidden">
    <div class="field">
      <label class="lbl">樓層</label>
      <select id="r-floor" onchange="filterAreas()"></select>
    </div>
    <div class="field">
      <label class="lbl">區域</label>
      <select id="r-area"></select>
    </div>
    <div class="field">
      <label class="lbl">報修說明</label>
      <textarea id="r-desc" placeholder="請詳述區域位置及異常狀況"></textarea>
    </div>
    <div class="field">
      <label class="lbl">上傳照片（最多3張）</label>
      <div class="photo-upload-wrap">
        <div class="photo-slot" id="slot0" onclick="pickPhoto(0)">
          <span class="plus">＋</span>
          <img id="prev0" style="display:none">
          <button class="rm" onclick="removePhoto(event,0)">✕</button>
        </div>
        <div class="photo-slot" id="slot1" onclick="pickPhoto(1)">
          <span class="plus">＋</span>
          <img id="prev1" style="display:none">
          <button class="rm" onclick="removePhoto(event,1)">✕</button>
        </div>
        <div class="photo-slot" id="slot2" onclick="pickPhoto(2)">
          <span class="plus">＋</span>
          <img id="prev2" style="display:none">
          <button class="rm" onclick="removePhoto(event,2)">✕</button>
        </div>
      </div>
      <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden"
        onchange="handlePhoto(event)">
    </div>
    <div class="err" id="r-form-err"></div>
    <button class="btn" onclick="submitRepair()">送出報修</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="showScreen('screen-repair-login')">返回</button>
  </div>

  <!-- ④ 報修成功 -->
  <div id="screen-repair-ok" class="success-wrap hidden">
    <div class="success-icon">✓</div>
    <h2>報修已送出</h2>
    <p>廠務已收到通知，<br>請至「報修進度查看」追蹤處理狀況。</p>
    <button class="btn" onclick="goHome()">回首頁</button>
  </div>

  <!-- ⑤ 進度查詢 - 登入 -->
  <div id="screen-query-login" class="login-wrap hidden">
    <h2>報修進度查看</h2>
    <p>請輸入工號，密碼為您的工號</p>
    <div class="field">
      <label class="lbl">工號</label>
      <input type="tel" id="q-empid" placeholder="請輸入工號" maxlength="20">
    </div>
    <div class="err" id="q-login-err"></div>
    <button class="btn" onclick="queryLogin()">登入</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="goHome()">返回</button>
  </div>

  <!-- ⑥ 進度查詢 - 列表 -->
  <div id="screen-query-list" class="hidden">
    <div class="toolbar">
      <select id="q-days" onchange="loadRecords()">
        <option value="30">近一個月</option>
        <option value="180">近半年</option>
        <option value="365">近一年</option>
      </select>
      <select id="q-status" onchange="renderList()">
        <option value="all">全部</option>
        <option value="open">未完成</option>
      </select>
      <button class="refresh" onclick="loadRecords()">重新整理</button>
    </div>
    <div class="summary" id="q-summary"></div>
    <div class="list-wrap" id="q-list"></div>
  </div>

</div>

<div id="loading" class="overlay hidden"><div class="spinner"></div></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxyq1XRF8VC_qObT9EDMFvlKesyySSk_ub4u7djjt7tu4JR52MA4SHIfRsrgOASWY42/exec';

let config = { floors:[], areas:[], employees:{} };
let currentUser = null; // { role, name, dept, empId }
let allRecords = [];
let photoSlots = ['','',''];
let currentPhotoSlot = 0;

const qs = new URLSearchParams(location.search);
const presetFloor = qs.get('floor');
const presetArea  = qs.get('area');

const BLUE_STATUS = ['處理完成','其它_結案','非廠務權責'];
function statusCat(p){
  if(!p) return 'red';
  if(BLUE_STATUS.includes(p)) return 'blue';
  return 'orange';
}

function el(id){ return document.getElementById(id); }
function showLoading(v){ el('loading').classList.toggle('hidden',!v); }
function showScreen(id){
  ['screen-home','screen-repair-login','screen-repair-form','screen-repair-ok',
   'screen-query-login','screen-query-list'].forEach(s=>el(s).classList.add('hidden'));
  el(id).classList.remove('hidden');
}
function goHome(){
  el('header-title').textContent='廠務行動化報修';
  el('header-sub').textContent='東立材料股份有限公司';
  showScreen('screen-home');
}

// ── 載入設定 ──
function loadConfig(){
  fetch(GAS_URL+'?action=config').then(r=>r.json()).then(d=>{
    config=d;
    buildFloorSelect();
    filterAreas();
  }).catch(()=>{});
}

function buildFloorSelect(){
  const sel=el('r-floor'); sel.innerHTML='';
  config.floors.forEach(f=>{
    const o=document.createElement('option'); o.value=f; o.textContent=f; sel.appendChild(o);
  });
  if(presetFloor && config.floors.includes(presetFloor)) sel.value=presetFloor;
  filterAreas();
}

function filterAreas(){
  const floor=el('r-floor').value;
  const sel=el('r-area'); sel.innerHTML='';
  // 前綴比對：選1F → 顯示 1F_ 開頭的；無底線的（全棟通用）也顯示
  const filtered = config.areas.filter(a=>{
    const prefix = floor+'_';
    return a.startsWith(prefix) || !a.includes('_');
  });
  filtered.forEach(a=>{
    const o=document.createElement('option');
    o.value=a;
    // 顯示時去掉樓層前綴
    o.textContent = a.startsWith(floor+'_') ? a.slice(floor.length+1) : a;
    sel.appendChild(o);
  });
  if(presetArea){
    const match = filtered.find(a=>a===presetArea||a.endsWith('_'+presetArea));
    if(match) sel.value=match;
  }
}

// ── 首頁導航 ──
function gotoRepair(){
  el('header-title').textContent='廠務報修';
  el('r-empid').value=''; el('r-name').value='';
  el('r-login-err').style.display='none';
  showScreen('screen-repair-login');
  if(!config.floors.length) loadConfig();
}
function gotoQuery(){
  el('header-title').textContent='報修進度查看';
  el('q-empid').value='';
  el('q-login-err').style.display='none';
  showScreen('screen-query-login');
}

// ── 報修：工號自動帶姓名 ──
el('r-empid').addEventListener('input',()=>{
  const id=el('r-empid').value.trim();
  if(config.employees[id]) el('r-name').value=config.employees[id];
});

function repairNext(){
  const empId=el('r-empid').value.trim();
  const name=el('r-name').value.trim();
  if(!name){ el('r-login-err').textContent='請填寫姓名'; el('r-login-err').style.display='block'; return; }
  el('r-login-err').style.display='none';
  currentUser={ empId, name };
  // 重設表單
  el('r-desc').value='';
  photoSlots=['','',''];
  for(let i=0;i<3;i++){
    el('prev'+i).style.display='none';
    el('slot'+i).classList.remove('has-photo');
  }
  showScreen('screen-repair-form');
  if(!config.floors.length) loadConfig();
}

// ── 照片 ──
function pickPhoto(idx){
  currentPhotoSlot=idx;
  el('photo-input').value='';
  el('photo-input').click();
}
function removePhoto(e,idx){
  e.stopPropagation();
  photoSlots[idx]='';
  el('prev'+idx).style.display='none';
  el('slot'+idx).classList.remove('has-photo');
}
function handlePhoto(e){
  const file=e.target.files[0]; if(!file) return;
  const idx=currentPhotoSlot;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=1000;
      const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const b64=canvas.toDataURL('image/jpeg',0.7);
      photoSlots[idx]=b64;
      el('prev'+idx).src=b64; el('prev'+idx).style.display='block';
      el('slot'+idx).classList.add('has-photo');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── 送出報修 ──
function submitRepair(){
  const floor=el('r-floor').value;
  const area=el('r-area').value;
  const desc=el('r-desc').value.trim();
  if(!desc){ el('r-form-err').textContent='請填寫報修說明'; el('r-form-err').style.display='block'; return; }
  el('r-form-err').style.display='none';

  showLoading(true);
  fetch(GAS_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({
      action:'create', floor, area,
      description:desc,
      reporterName:currentUser.name,
      empId:currentUser.empId,
      photos:photoSlots.filter(p=>p)
    })
  }).then(r=>r.json()).then(res=>{
    if(res.success) showScreen('screen-repair-ok');
    else{ el('r-form-err').textContent=res.error||'送出失敗'; el('r-form-err').style.display='block'; }
  }).catch(()=>{
    el('r-form-err').textContent='連線失敗，請重試'; el('r-form-err').style.display='block';
  }).finally(()=>showLoading(false));
}

// ── 進度查詢登入 ──
function queryLogin(){
  const empId=el('q-empid').value.trim();
  if(!empId){ el('q-login-err').textContent='請輸入工號'; el('q-login-err').style.display='block'; return; }
  showLoading(true);
  fetch(GAS_URL+'?action=login&empId='+encodeURIComponent(empId))
    .then(r=>r.json()).then(res=>{
      if(res.success){
        currentUser={ empId, ...res };
        el('header-sub').textContent=res.name+'（'+roleName(res.role)+'）';
        el('q-login-err').style.display='none';
        showScreen('screen-query-list');
        loadRecords();
      } else {
        el('q-login-err').textContent=res.error||'工號不存在'; el('q-login-err').style.display='block';
      }
    }).catch(()=>{ el('q-login-err').textContent='連線失敗'; el('q-login-err').style.display='block'; })
    .finally(()=>showLoading(false));
}
el('q-empid').addEventListener('keydown',e=>{ if(e.key==='Enter') queryLogin(); });

function roleName(r){
  return {staff:'一般員工',dept_mgr:'部門主管',facility:'廠務',vice_director:'副廠長',facility_mgr:'廠務主管'}[r]||r;
}

function loadRecords(){
  if(!currentUser) return;
  const days=el('q-days').value;
  showLoading(true);
  fetch(GAS_URL+'?action=list&empId='+encodeURIComponent(currentUser.empId)+'&days='+days)
    .then(r=>r.json()).then(res=>{
      if(res.success){ allRecords=res.records; renderList(); }
    }).finally(()=>showLoading(false));
}

function renderList(){
  const statusFilter=el('q-status').value;
  let list=allRecords;
  if(statusFilter==='open') list=allRecords.filter(r=>statusCat(r.progress)!=='blue');

  el('q-summary').textContent='共 '+list.length+' 筆';

  const wrap=el('q-list'); wrap.innerHTML='';
  if(!list.length){ wrap.innerHTML='<div class="empty">目前沒有符合條件的紀錄</div>'; return; }

  const role=currentUser.role;
  const canEdit = role==='facility'||role==='facility_mgr';
  const canDelete = role==='facility_mgr';

  list.forEach(r=>{
    const cat=statusCat(r.progress);
    const div=document.createElement('div'); div.className='card';
    const photos=[];
    [r.photo1,r.photo2,r.photo3].forEach((p,i)=>{ if(p) photos.push(`<a href="${p}" target="_blank"><img src="${p}"></a>`); });

    let editBlock='';
    if(canEdit){
      const isMgr=role==='facility_mgr';
      editBlock=`<div class="edit-block">
        <div class="edit-row">
          <div><label>維修進度</label>
            <select class="f-progress">
              <option value="">未指派</option>
              <option value="非廠務權責">非廠務權責</option>
              <option value="處理中">處理中</option>
              <option value="委外處理">委外處理</option>
              <option value="處理完成">處理完成</option>
              <option value="其它評估">其它評估</option>
              <option value="其它_結案">其它_結案</option>
            </select>
          </div>
          <div><label>維修人員</label>
            <input type="text" class="f-tech" value="${esc(r.technician)}" placeholder="預設徐宏昌">
          </div>
        </div>
        <div class="edit-row full"><div><label>備註${['其它評估','其它_結案'].includes(r.progress)?'（必填）':''}</label>
          <textarea class="f-note" rows="2">${esc(r.note)}</textarea>
        </div></div>
        <div class="edit-actions">
          <button class="save-btn" onclick="saveUpdate('${r.id}',this)">儲存</button>
          ${canDelete?`<button class="del-btn" onclick="deleteRecord('${r.id}',this)">刪除</button>`:''}
        </div>
        <div class="saved-tip">✓ 已更新</div>
      </div>`;
    }

    div.innerHTML=`
      <div class="card-top">
        <div>
          <div class="card-title">${esc(r.floor)} ${esc(r.area)}</div>
          <div class="card-meta">${esc(r.date)} ${esc(r.time)} · ${esc(r.reporter)}（${esc(r.dept)||'-'}）</div>
        </div>
        <div class="badges">
          <span class="badge ${cat}"><span class="dot"></span>${r.progress||'未處理'}</span>
        </div>
      </div>
      <div class="card-desc">${esc(r.description)}</div>
      ${photos.length?'<div class="photos">'+photos.join('')+'</div>':''}
      <div class="card-detail">
        ${r.technician?'維修人員：'+esc(r.technician)+'<br>':''}
        ${r.note?'備註：'+esc(r.note):''}
      </div>
      ${editBlock}`;

    // 設定進度下拉選單預設值
    if(canEdit) div.querySelector('.f-progress').value=r.progress||'';
    wrap.appendChild(div);
  });
}

function saveUpdate(id, btn){
  const card=btn.closest('.card');
  const progress=card.querySelector('.f-progress').value;
  const note=card.querySelector('.f-note').value.trim();

  // 其它評估/其它_結案必填備註
  if(['其它評估','其它_結案'].includes(progress)&&!note){
    alert('其它評估／其它_結案 必須填寫備註說明'); return;
  }

  const techInput=card.querySelector('.f-tech');
  const tech=techInput.value.trim()||'徐宏昌';
  techInput.value=tech;

  showLoading(true);
  fetch(GAS_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({ action:'update', id, progress, technician:tech, note, empId:currentUser.empId })
  }).then(r=>r.json()).then(res=>{
    if(res.success){
      const tip=card.querySelector('.saved-tip');
      tip.style.display='block'; setTimeout(()=>{ tip.style.display='none'; loadRecords(); },1200);
    } else alert(res.error||'更新失敗');
  }).catch(()=>alert('連線失敗')).finally(()=>showLoading(false));
}

function deleteRecord(id, btn){
  if(!confirm('確定要刪除這筆報修工單？此操作無法復原。')) return;
  showLoading(true);
  fetch(GAS_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({ action:'delete', id, empId:currentUser.empId })
  }).then(r=>r.json()).then(res=>{
    if(res.success) loadRecords();
    else alert(res.error||'刪除失敗');
  }).catch(()=>alert('連線失敗')).finally(()=>showLoading(false));
}

function esc(s){
  if(!s) return '';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>

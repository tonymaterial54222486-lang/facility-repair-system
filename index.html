<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廠務行動化報修</title>
<style>
:root{
  --primary:#0f6e56; --primary-dark:#085041; --bg:#f4f3ef; --card:#fff;
  --border:#d8d5cc; --text:#2c2c2a; --muted:#6b6a64; --danger:#a32d2d;
  --amber:#854f0b; --amber-bg:#faeeda; --blue:#0c447c; --blue-bg:#e6f1fb;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;}
.wrap{max-width:480px; margin:0 auto; min-height:100vh; background:var(--card); box-shadow:0 0 24px rgba(0,0,0,.06);}

header{background:var(--primary-dark); color:#fff; padding:16px 20px; position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px;}
header h1{margin:0; font-size:18px; font-weight:500; flex:1;}
header p{margin:0; font-size:12px; opacity:.8;}
.back-btn{background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:0 4px; line-height:1;}

.content{padding:20px;}
.field{margin-bottom:16px;}
label.lbl{display:block; font-size:13px; font-weight:500; color:var(--muted); margin-bottom:5px;}
input[type=text],input[type=password],input[type=tel],select,textarea{
  width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px;
  font-size:16px; background:#fff; color:var(--text); font-family:inherit; appearance:none;}
textarea{min-height:80px; resize:vertical;}
select{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%236b6a64" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>');
  background-repeat:no-repeat; background-position:right 14px center; padding-right:36px;}
.hint{font-size:12px; color:var(--muted); margin-top:4px;}
.row2{display:flex; gap:12px;}
.row2>div{flex:1;}
.btn{width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:8px;
  font-size:16px; font-weight:500; cursor:pointer; margin-top:4px;}
.btn:disabled{background:var(--border); color:var(--muted);}
.btn-outline{background:none; border:1.5px solid var(--primary); color:var(--primary);}
.btn-sm{padding:10px 14px; font-size:14px; margin-top:0;}
.err{color:var(--danger); font-size:13px; margin-top:6px; display:none;}
.hidden{display:none !important;}

/* ── 首頁 ── */
.home-wrap{padding:28px 20px 40px;}
.home-wrap .logo{text-align:center; margin-bottom:28px;}
.home-wrap .logo .emoji{font-size:48px; display:block; margin-bottom:8px;}
.home-wrap .logo h2{margin:0; font-size:20px; font-weight:600;}
.home-wrap .logo p{margin:6px 0 0; font-size:13px; color:var(--muted);}

.home-card{
  border-radius:16px; padding:24px 20px; margin-bottom:16px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  transition:transform .1s, box-shadow .1s; position:relative; overflow:hidden;
}
.home-card:active{transform:scale(.97);}
.home-card.repair{background:linear-gradient(135deg,#0f6e56 0%,#1a9e7a 100%); color:#fff;}
.home-card.query{background:linear-gradient(135deg,#1a4a8a 0%,#2d7dd2 100%); color:#fff;}
.home-card .card-emoji{font-size:56px; margin-bottom:12px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.2));}
.home-card h3{margin:0 0 6px; font-size:20px; font-weight:700; letter-spacing:.5px;}
.home-card p{margin:0; font-size:13px; opacity:.88; line-height:1.5;}
.home-card .deco{position:absolute; font-size:80px; opacity:.08; right:-10px; bottom:-10px; transform:rotate(-15deg);}

/* ── 報修表單 ── */
.photo-upload-wrap{display:flex; gap:8px;}
.photo-slot{width:88px; height:88px; border:2px dashed var(--border); border-radius:8px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; flex-shrink:0;}
.photo-slot img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
.photo-slot .plus{font-size:28px; color:var(--muted); position:relative; z-index:1;}
.photo-slot .rm{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff;
  border:none; border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer;
  display:none; align-items:center; justify-content:center; z-index:2; padding:0;}
.photo-slot.has-photo .rm{display:flex;}

/* ── 進度查詢 列表 ── */
.toolbar{display:flex; gap:8px; padding:10px 14px; background:#fff;
  border-bottom:1px solid var(--border); position:sticky; top:57px; z-index:9; flex-wrap:wrap; align-items:center;}
.toolbar select{flex:1; min-width:90px; padding:8px 10px; font-size:13px; border:1px solid var(--border); border-radius:8px;}
.toolbar .refresh-btn{padding:8px 14px; background:var(--primary); color:#fff; border:none;
  border-radius:8px; font-size:13px; cursor:pointer; white-space:nowrap;}
.summary{padding:7px 16px; font-size:12px; color:var(--muted); background:#fafaf9; border-bottom:1px solid var(--border);}
.list-wrap{padding:10px 14px 40px;}

/* 條列式工單 */
.rec-row{
  background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 14px;
  margin-bottom:8px; cursor:pointer; display:flex; align-items:center; gap:10px;
}
.rec-row:active{background:var(--bg);}
.rec-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.rec-dot.red{background:var(--danger);}
.rec-dot.orange{background:#e07b00;}
.rec-dot.blue{background:var(--blue);}
.rec-main{flex:1; min-width:0;}
.rec-title{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rec-sub{font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rec-badge{font-size:11px; padding:2px 8px; border-radius:12px; white-space:nowrap; flex-shrink:0;}
.rec-badge.red{background:#fcebeb; color:var(--danger);}
.rec-badge.orange{background:var(--amber-bg); color:var(--amber);}
.rec-badge.blue{background:var(--blue-bg); color:var(--blue);}
.rec-arrow{color:var(--border); font-size:16px; flex-shrink:0;}

/* 工單細項頁 */
.detail-wrap{padding:16px;}
.detail-section{margin-bottom:18px;}
.detail-section h4{margin:0 0 8px; font-size:13px; font-weight:500; color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:6px;}
.detail-row{display:flex; gap:8px; margin-bottom:6px; font-size:14px;}
.detail-row .dk{color:var(--muted); font-size:13px; min-width:72px; flex-shrink:0;}
.detail-row .dv{flex:1; word-break:break-all;}
.photo-links{display:flex; flex-direction:column; gap:6px;}
.photo-links a{font-size:14px; color:var(--blue); text-decoration:none; display:flex; align-items:center; gap:6px;}
.photo-links a:before{content:"📷"; font-size:16px;}

.edit-section{margin-top:16px; padding-top:16px; border-top:1px solid var(--border);}
.edit-section h4{margin:0 0 10px; font-size:13px; font-weight:500; color:var(--muted);}
.edit-field{margin-bottom:10px;}
.edit-field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
.edit-field select,.edit-field input,.edit-field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px;
  font-size:14px; font-family:inherit; appearance:none;}
.edit-field textarea{min-height:70px; resize:vertical;}
.edit-row2{display:flex; gap:8px;}
.edit-row2>div{flex:1;}
.action-btns{display:flex; gap:8px; margin-top:12px;}
.action-btns button{flex:1; padding:12px; border:none; border-radius:8px; font-size:14px; cursor:pointer; font-weight:500;}
.save-btn{background:var(--primary); color:#fff;}
.del-btn{background:#fcebeb; color:var(--danger);}
.saved-tip{font-size:12px; color:var(--primary-dark); margin-top:8px; display:none; text-align:center;}

/* 成功 */
.success-wrap{padding:60px 24px; text-align:center;}
.success-icon{width:72px; height:72px; border-radius:50%; background:#e1f5ee; color:var(--primary-dark);
  font-size:34px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
.success-wrap h2{font-size:19px; margin:0 0 8px;}
.success-wrap p{color:var(--muted); font-size:14px; margin:0 0 28px; line-height:1.6;}

/* loading */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex;
  align-items:center; justify-content:center; z-index:100;}
.spinner{width:36px; height:36px; border:4px solid #fff; border-top-color:transparent;
  border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{padding:40px 20px; text-align:center; color:var(--muted); font-size:14px;}

.login-wrap{padding:40px 20px 20px;}
.login-wrap h2{font-size:18px; font-weight:600; margin:0 0 6px;}
.login-wrap .sub{color:var(--muted); font-size:13px; margin:0 0 24px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back-btn hidden" id="hdr-back" onclick="goHome()">‹</button>
    <div style="flex:1">
      <h1 id="hdr-title">廠務行動化報修</h1>
      <p id="hdr-sub">東立材料股份有限公司</p>
    </div>
  </header>

  <!-- 首頁 -->
  <div id="s-home" class="home-wrap">
    <div class="logo">
      <span class="emoji">🏭</span>
      <h2>廠務行動化報修系統</h2>
      <p>東立材料股份有限公司</p>
    </div>
    <div class="home-card repair" onclick="gotoRepair()">
      <div class="card-emoji">🔧</div>
      <h3>廠務報修</h3>
      <p>發現異常？立即填寫報修<br>讓廠務人員第一時間掌握！</p>
      <span class="deco">🔩</span>
    </div>
    <div class="home-card query" onclick="gotoQuery()">
      <div class="card-emoji">📋</div>
      <h3>報修進度查看</h3>
      <p>追蹤報修處理狀況<br>掌握每筆工單最新進度</p>
      <span class="deco">📊</span>
    </div>
  </div>

  <!-- 報修登入 -->
  <div id="s-repair-login" class="content hidden">
    <div class="field">
      <label class="lbl">工號</label>
      <input type="tel" id="r-empid" placeholder="請輸入工號" maxlength="20">
      <div class="hint">💡 輸入工號可自動帶入姓名</div>
    </div>
    <div class="field">
      <label class="lbl">姓名</label>
      <input type="text" id="r-name" placeholder="可手動輸入">
    </div>
    <div class="err" id="r-login-err"></div>
    <button class="btn" onclick="repairNext()">下一步 →</button>
  </div>

  <!-- 報修表單 -->
  <div id="s-repair-form" class="content hidden">
    <div class="field">
      <label class="lbl">樓層</label>
      <select id="r-floor" onchange="filterAreas()"></select>
    </div>
    <div class="field">
      <label class="lbl">區域</label>
      <select id="r-area"></select>
    </div>
    <div class="field">
      <label class="lbl">報修說明</label>
      <textarea id="r-desc" placeholder="請詳述區域位置及異常狀況"></textarea>
    </div>
    <div class="field">
      <label class="lbl">上傳照片（限1張，自動壓縮）</label>
      <div class="photo-upload-wrap">
        <div class="photo-slot" id="slot0" onclick="pickPhoto(0)">
          <span class="plus">＋</span><img id="prev0" style="display:none">
          <button class="rm" onclick="removePhoto(event,0)">✕</button>
        </div>
      </div>
      <div class="hint">📷 點擊後可選擇「直接拍照」或「從相簿選取」</div>
      <input type="file" id="photo-input" accept="image/*"
        class="hidden" onchange="handlePhoto(event)">
    </div>
    <div class="err" id="r-form-err"></div>
    <button class="btn" onclick="submitRepair()">送出報修</button>
  </div>

  <!-- 報修成功 -->
  <div id="s-repair-ok" class="success-wrap hidden">
    <div class="success-icon">✓</div>
    <h2>報修已送出！</h2>
    <p>廠務已收到通知，<br>可至「報修進度查看」追蹤處理狀況。</p>
    <button class="btn" onclick="goHome()">回首頁</button>
  </div>

  <!-- 進度查詢登入 -->
  <div id="s-query-login" class="login-wrap hidden">
    <h2>報修進度查看</h2>
    <p class="sub">請輸入工號登入，密碼為您的工號</p>
    <div class="field">
      <label class="lbl">工號</label>
      <input type="tel" id="q-empid" placeholder="請輸入工號" maxlength="20">
    </div>
    <div class="err" id="q-login-err"></div>
    <button class="btn" onclick="queryLogin()">登入查詢</button>
  </div>

  <!-- 進度查詢列表 -->
  <div id="s-query-list" class="hidden">
    <div class="toolbar">
      <select id="q-days" onchange="loadRecords()">
        <option value="30">近一個月</option>
        <option value="180">近半年</option>
        <option value="365">近一年</option>
      </select>
      <select id="q-status" onchange="renderList()">
        <option value="all">全部</option>
        <option value="open">未完成</option>
      </select>
      <button class="refresh-btn" onclick="loadRecords()">重新整理</button>
      <button class="refresh-btn" id="export-btn" style="background:#1a4a8a;display:none;" onclick="exportExcel()">📤 匯出</button>
      <button class="refresh-btn" id="notify-btn" style="background:#7b3f00;display:none;" onclick="openNotifyPanel()">📨 寄送通知</button>
    </div>
    <div class="summary" id="q-summary"></div>
    <div class="list-wrap" id="q-list"></div>
  </div>

  <!-- 工單細項 -->
  <div id="s-detail" class="hidden">
    <div class="detail-wrap" id="detail-content"></div>
  </div>
</div>

<!-- 收件人選擇彈出層 -->
<div id="notify-overlay" class="overlay hidden" onclick="closeNotifyPanel()">
  <div onclick="event.stopPropagation()" style="background:#fff;border-radius:16px;padding:24px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto;">
    <h3 style="margin:0 0 6px;font-size:17px;color:#0f6e56;">選擇收件人</h3>
    <p style="margin:0 0 16px;font-size:13px;color:#888;">可多選，選完按確認寄出</p>
    <div id="recipient-list" style="margin-bottom:16px;"></div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button onclick="closeNotifyPanel()" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;">取消</button>
      <button onclick="sendNotify()" style="flex:1;padding:12px;background:#0f6e56;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;">確認寄出</button>
    </div>
  </div>
</div>

<div id="loading" class="overlay hidden"><div class="spinner"></div></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxyq1XRF8VC_qObT9EDMFvlKesyySSk_ub4u7djjt7tu4JR52MA4SHIfRsrgOASWY42/exec';

// 一進頁面就預先載入設定（員工對照表、樓層、區域）
window.addEventListener('DOMContentLoaded', () => { loadConfig(); });

let config={floors:[],areas:[],employees:{}};
let currentUser=null;
let allRecords=[];
let photoSlots=['','',''];
let currentPhotoSlot=0;

const BLUE_STATUS=['處理完成','其它_結案','非廠務權責'];
const SCREENS=['s-home','s-repair-login','s-repair-form','s-repair-ok','s-query-login','s-query-list','s-detail'];

function el(id){return document.getElementById(id);}
function showLoading(v){el('loading').classList.toggle('hidden',!v);}

function showScreen(id, title, sub){
  SCREENS.forEach(s=>el(s).classList.add('hidden'));
  el(id).classList.remove('hidden');
  el('hdr-title').textContent=title||'廠務行動化報修';
  el('hdr-sub').textContent=sub||'東立材料股份有限公司';
  const isHome=id==='s-home';
  el('hdr-back').classList.toggle('hidden', isHome);
}

function goHome(){
  currentUser=null; allRecords=[];
  showScreen('s-home');
}

// ── 格式化日期時間 ──
function fmtDate(v){
  if(!v) return '';
  if(v instanceof Date) return v.getFullYear()+'/'+(v.getMonth()+1).toString().padStart(2,'0')+'/'+v.getDate().toString().padStart(2,'0');
  const s=String(v);
  // ISO格式
  if(s.includes('T')){
    const d=new Date(s);
    if(!isNaN(d)) return d.getFullYear()+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getDate().toString().padStart(2,'0');
  }
  return s.replace(/-/g,'/').split('T')[0];
}
function fmtTime(v){
  if(!v) return '';
  const s=String(v);
  // 1899開頭的序列值
  if(s.startsWith('1899-12-30T')){
    const d=new Date(s);
    return d.getUTCHours().toString().padStart(2,'0')+':'+d.getUTCMinutes().toString().padStart(2,'0');
  }
  if(s.includes('T')){
    const d=new Date(s);
    if(!isNaN(d)) return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  }
  // 已經是 HH:mm
  if(/^\d{1,2}:\d{2}/.test(s)) return s.slice(0,5);
  return s;
}

function statusCat(p){
  if(!p) return 'red';
  if(BLUE_STATUS.includes(p)) return 'blue';
  return 'orange';
}
function statusLabel(p){ return p||'未處理'; }

function esc(s){
  if(!s) return '';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── 設定載入 ──
function loadConfig(){
  fetch(GAS_URL+'?action=config').then(r=>r.json()).then(d=>{
    config=d; buildFloorSelect(); filterAreas();
  }).catch(()=>{});
}
function buildFloorSelect(){
  const sel=el('r-floor'); sel.innerHTML='';
  config.floors.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;sel.appendChild(o);});
  filterAreas();
}
function filterAreas(){
  const floor=el('r-floor').value;
  const sel=el('r-area'); sel.innerHTML='';
  config.areas.filter(a=>a.startsWith(floor+'_')||!a.includes('_')).forEach(a=>{
    const o=document.createElement('option');
    o.value=a; o.textContent=a.startsWith(floor+'_')?a.slice(floor.length+1):a;
    sel.appendChild(o);
  });
}

// ── 首頁 ──
function gotoRepair(){
  el('r-empid').value=''; el('r-name').value='';
  el('r-login-err').style.display='none';
  showScreen('s-repair-login','廠務報修');
  if(!config.floors.length) loadConfig();
}
function gotoQuery(){
  el('q-empid').value=''; el('q-login-err').style.display='none';
  showScreen('s-query-login','報修進度查看');
}

// ── 報修工號自動帶姓名 ──
el('r-empid').addEventListener('input',()=>{
  const id=el('r-empid').value.trim();
  if(config.employees && config.employees[id]) {
    el('r-name').value=config.employees[id];
  } else if(id.length >= 5) {
    // config還沒載入時，主動重新嘗試載入一次
    if(!config.floors.length) loadConfig().then && loadConfig();
  }
});
function repairNext(){
  const name=el('r-name').value.trim();
  if(!name){el('r-login-err').textContent='請填寫姓名';el('r-login-err').style.display='block';return;}
  el('r-login-err').style.display='none';
  currentUser={empId:el('r-empid').value.trim(), name};
  el('r-desc').value='';
  photoSlots=['','',''];
  el('prev0').style.display='none';
  el('slot0').classList.remove('has-photo');
  showScreen('s-repair-form','廠務報修');
  if(!config.floors.length) loadConfig();
}

// ── 照片 ──
function pickPhoto(idx){el('photo-input').value='';el('photo-input').click();}
function removePhoto(e,idx){
  e.stopPropagation();
  photoSlots[0]='';el('prev0').style.display='none';el('slot0').classList.remove('has-photo');
}
function handlePhoto(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const MAX_BYTES = 800 * 1024; // 800KB上限（附件用，畫質清楚又不過大）
      const MAX_W = 1200;
      const scale = Math.min(1, MAX_W / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let quality = 0.82;
      let b64 = c.toDataURL('image/jpeg', quality);
      while (b64.length * 0.75 > MAX_BYTES && quality > 0.15) {
        quality = Math.round((quality - 0.08) * 100) / 100;
        b64 = c.toDataURL('image/jpeg', quality);
      }
      photoSlots[0]=b64;
      el('prev0').src=b64; el('prev0').style.display='block';
      el('slot0').classList.add('has-photo');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── 送出報修 ──
function submitRepair(){
  const desc=el('r-desc').value.trim();
  if(!desc){el('r-form-err').textContent='請填寫報修說明';el('r-form-err').style.display='block';return;}
  el('r-form-err').style.display='none';
  showLoading(true);
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'create',floor:el('r-floor').value,area:el('r-area').value,
      description:desc,reporterName:currentUser.name,empId:currentUser.empId,
      photos:photoSlots[0]?[photoSlots[0]]:[]})
  }).then(r=>r.json()).then(res=>{
    if(res.success) showScreen('s-repair-ok','報修已送出');
    else{el('r-form-err').textContent=res.error||'送出失敗';el('r-form-err').style.display='block';}
  }).catch(()=>{el('r-form-err').textContent='連線失敗，請重試';el('r-form-err').style.display='block';})
  .finally(()=>showLoading(false));
}

// ── 進度查詢登入 ──
function queryLogin(){
  const empId=el('q-empid').value.trim();
  if(!empId){el('q-login-err').textContent='請輸入工號';el('q-login-err').style.display='block';return;}
  showLoading(true);
  fetch(GAS_URL+'?action=login&empId='+encodeURIComponent(empId))
  .then(r=>r.json()).then(res=>{
    if(res.success){
      currentUser={empId,...res};
      showScreen('s-query-list','報修進度查看',res.name+'（'+roleName(res.role)+'）');
      loadRecords();
    } else {el('q-login-err').textContent=res.error||'工號不存在';el('q-login-err').style.display='block';}
  }).catch(()=>{el('q-login-err').textContent='連線失敗';el('q-login-err').style.display='block';})
  .finally(()=>showLoading(false));
}
el('q-empid').addEventListener('keydown',e=>{if(e.key==='Enter')queryLogin();});

function roleName(r){
  return {staff:'一般員工',dept_mgr:'部門主管',facility:'廠務',vice_director:'副廠長',facility_mgr:'廠務主管'}[r]||r;
}

function loadRecords(){
  if(!currentUser) return;
  showLoading(true);
  const exportBtn=el('export-btn');
  if(exportBtn) exportBtn.style.display=(currentUser.role==='facility'||currentUser.role==='facility_mgr')?'block':'none';
  const notifyBtn=el('notify-btn');
  if(notifyBtn) notifyBtn.style.display=(currentUser.role==='facility'||currentUser.role==='facility_mgr')?'block':'none';
  fetch(GAS_URL+'?action=list&empId='+encodeURIComponent(currentUser.empId)+'&days='+el('q-days').value)
  .then(r=>r.json()).then(res=>{if(res.success){allRecords=res.records;renderList();}})
  .finally(()=>showLoading(false));
}

// ── 條列式列表 ──
function renderList(){
  const statusFilter=el('q-status').value;
  let list=allRecords;
  if(statusFilter==='open') list=allRecords.filter(r=>statusCat(r.progress)!=='blue');
  el('q-summary').textContent='共 '+list.length+' 筆';
  const wrap=el('q-list'); wrap.innerHTML='';
  if(!list.length){wrap.innerHTML='<div class="empty">目前沒有符合條件的紀錄</div>';return;}
  list.forEach(r=>{
    const cat=statusCat(r.progress);
    const div=document.createElement('div');
    div.className='rec-row';
    const canNotify=currentUser.role==='facility'||currentUser.role==='facility_mgr';
    div.innerHTML=`
      ${canNotify?`<input type="checkbox" class="rec-check" data-id="${esc(r.id)}" onclick="event.stopPropagation()" style="width:18px;height:18px;flex-shrink:0;cursor:pointer;">`:'' }
      <div class="rec-dot ${cat}"></div>
      <div class="rec-main">
        <div class="rec-title">${esc(r.floor)} ${esc(r.area)}</div>
        <div class="rec-sub">${fmtDate(r.date)} ${fmtTime(r.time)} · ${esc(r.reporter||r.empId)}</div>
      </div>
      <span class="rec-badge ${cat}">${esc(statusLabel(r.progress))}</span>
      <span class="rec-arrow">›</span>`;
    div.addEventListener('click',()=>showDetail(r));
    wrap.appendChild(div);
  });
}

// ── 工單細項 ──
function showDetail(r){
  const cat=statusCat(r.progress);
  const role=currentUser.role;
  const canEdit=role==='facility'||role==='facility_mgr';
  const canDelete=role==='facility_mgr';

  const photoLinks=[];
  if(r.photo1) photoLinks.push(`<a href="${r.photo1}" target="_blank">照片 1</a>`);
  if(r.photo2) photoLinks.push(`<a href="${r.photo2}" target="_blank">照片 2</a>`);
  if(r.photo3) photoLinks.push(`<a href="${r.photo3}" target="_blank">照片 3</a>`);

  const editHtml=canEdit?`
    <div class="edit-section">
      <h4>廠務處理</h4>
      <div class="edit-row2">
        <div class="edit-field"><label>維修進度</label>
          <select class="f-progress" id="dp-progress">
            <option value="">未指派</option>
            <option value="非廠務權責">非廠務權責</option>
            <option value="處理中">處理中</option>
            <option value="委外處理">委外處理</option>
            <option value="處理完成">處理完成</option>
            <option value="其它評估">其它評估</option>
            <option value="其它_結案">其它_結案</option>
          </select>
        </div>
        <div class="edit-field"><label>維修人員</label>
          <input type="text" id="dp-tech" value="${esc(r.technician)}" placeholder="預設：徐宏昌">
        </div>
      </div>
      <div class="edit-field"><label>備註</label>
        <textarea id="dp-note" rows="3">${esc(r.note)}</textarea>
      </div>
      <div class="action-btns">
        <button class="save-btn" onclick="saveDetail('${r.id}')">儲存</button>
        ${canDelete?`<button class="del-btn" onclick="deleteDetail('${r.id}')">刪除此工單</button>`:''}
      </div>
      <div class="saved-tip" id="saved-tip">✓ 已更新</div>
    </div>`:'';

  el('detail-content').innerHTML=`
    <div class="detail-section">
      <h4>基本資訊</h4>
      <div class="detail-row"><span class="dk">ID</span><span class="dv">${esc(r.id)}</span></div>
      <div class="detail-row"><span class="dk">日期時間</span><span class="dv">${fmtDate(r.date)} ${fmtTime(r.time)}</span></div>
      <div class="detail-row"><span class="dk">樓層</span><span class="dv">${esc(r.floor)}</span></div>
      <div class="detail-row"><span class="dk">區域</span><span class="dv">${esc(r.area)}</span></div>
      <div class="detail-row"><span class="dk">報修人</span><span class="dv">${esc(r.reporter)} ${r.empId?'（'+r.empId+'）':''}</span></div>
      <div class="detail-row"><span class="dk">部門</span><span class="dv">${esc(r.dept)||'-'}</span></div>
    </div>
    <div class="detail-section">
      <h4>報修說明</h4>
      <div style="font-size:14px;line-height:1.7;">${esc(r.description)}</div>
    </div>
    ${photoLinks.length?`<div class="detail-section"><h4>照片</h4><div class="photo-links">${photoLinks.join('')}</div></div>`:''}
    <div class="detail-section">
      <h4>處理狀況</h4>
      <div class="detail-row"><span class="dk">維修進度</span><span class="dv"><span class="rec-badge ${cat}" style="font-size:13px;">${esc(statusLabel(r.progress))}</span></span></div>
      ${r.technician?`<div class="detail-row"><span class="dk">維修人員</span><span class="dv">${esc(r.technician)}</span></div>`:''}
      ${r.note?`<div class="detail-row"><span class="dk">備註</span><span class="dv">${esc(r.note)}</span></div>`:''}
    </div>
    ${editHtml}`;

  if(canEdit) el('dp-progress').value=r.progress||'';
  showScreen('s-detail','工單詳情',r.floor+' '+r.area);
}

function saveDetail(id){
  const progress=el('dp-progress').value;
  const note=el('dp-note').value.trim();
  if(['其它評估','其它_結案'].includes(progress)&&!note){alert('其它評估／其它_結案 必須填寫備註說明');return;}
  const tech=el('dp-tech').value.trim()||'徐宏昌';
  el('dp-tech').value=tech;
  showLoading(true);
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'update',id,progress,technician:tech,note,empId:currentUser.empId})
  }).then(r=>r.json()).then(res=>{
    if(res.success){
      const tip=el('saved-tip'); tip.style.display='block';
      setTimeout(()=>{tip.style.display='none'; showScreen('s-query-list','報修進度查看',currentUser.name+'（'+roleName(currentUser.role)+'）'); loadRecords();},1200);
    } else alert(res.error||'更新失敗');
  }).catch(()=>alert('連線失敗')).finally(()=>showLoading(false));
}

function deleteDetail(id){
  if(!confirm('確定要刪除這筆報修工單？此操作無法復原。')) return;
  showLoading(true);
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'delete',id,empId:currentUser.empId})
  }).then(r=>r.json()).then(res=>{
    if(res.success){showScreen('s-query-list','報修進度查看',currentUser.name+'（'+roleName(currentUser.role)+'）');loadRecords();}
    else alert(res.error||'刪除失敗');
  }).catch(()=>alert('連線失敗')).finally(()=>showLoading(false));
}

function exportExcel(){
  const days=el('q-days').value;
  const statusFilter=el('q-status').value;
  if(!confirm('確定要匯出目前篩選的工單資料並寄到您的信箱嗎？')) return;
  showLoading(true);
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'export',empId:currentUser.empId,days,statusFilter})
  }).then(r=>r.json()).then(res=>{
    if(res.success) alert('✓ 已寄出！共 '+res.count+' 筆\n收件信箱：'+res.email);
    else alert(res.error||'匯出失敗');
  }).catch(()=>alert('連線失敗，請重試')).finally(()=>showLoading(false));
}

// ── 寄送通知 ──────────────────────────────────────────────
let recipientOptions = []; // 從GAS載入

function openNotifyPanel(){
  const checks = document.querySelectorAll('.rec-check:checked');
  if(checks.length === 0){ alert('請先勾選要通知的工單'); return; }

  showLoading(true);
  // 載入收件人清單
  fetch(GAS_URL+'?action=recipients&empId='+encodeURIComponent(currentUser.empId))
  .then(r=>r.json()).then(res=>{
    if(!res.success){ alert(res.error||'無法載入收件人'); return; }
    recipientOptions = res.recipients;
    const listEl = el('recipient-list');
    listEl.innerHTML = recipientOptions.map((r,i)=>
      `<label style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:8px;cursor:pointer;">
        <input type="checkbox" class="rcpt-check" value="${i}" style="width:18px;height:18px;">
        <div>
          <div style="font-size:14px;font-weight:500;">${esc(r.name)}</div>
          <div style="font-size:12px;color:#888;">${esc(r.dept)} · ${esc(r.email)}</div>
        </div>
      </label>`
    ).join('');
    el('notify-overlay').classList.remove('hidden');
  }).catch(()=>alert('連線失敗')).finally(()=>showLoading(false));
}

function closeNotifyPanel(){
  el('notify-overlay').classList.add('hidden');
}

function sendNotify(){
  const checkedIds = [...document.querySelectorAll('.rec-check:checked')].map(c=>c.dataset.id);
  const checkedRcpts = [...document.querySelectorAll('.rcpt-check:checked')].map(c=>recipientOptions[parseInt(c.value)].email);

  if(checkedIds.length===0){ alert('請勾選工單'); return; }
  if(checkedRcpts.length===0){ alert('請選擇至少一位收件人'); return; }

  closeNotifyPanel();
  showLoading(true);
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'sendNotify', empId:currentUser.empId, ids:checkedIds, recipients:checkedRcpts})
  }).then(r=>r.json()).then(res=>{
    if(res.success){
      alert('✓ 已寄出！\n共 '+checkedIds.length+' 筆工單\n收件人：'+checkedRcpts.join('、'));
      // 取消所有勾選
      document.querySelectorAll('.rec-check').forEach(c=>c.checked=false);
    } else alert(res.error||'寄送失敗');
  }).catch(()=>alert('連線失敗')).finally(()=>showLoading(false));
}
</script>
</body>

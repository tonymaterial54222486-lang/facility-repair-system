<!doctype html><html lang="zh-Hant-TW"><head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>東立材料_廠務行動週報</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4f8;color:#172033;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.hidden{display:none!important}
.app{max-width:680px;margin:auto;min-height:100vh;min-height:100dvh;background:#fff}
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:25px}
.login-card{width:min(420px,100%);text-align:center}
.hero{font-size:92px}.login h1{color:#173d62}
input,select,textarea{width:100%;padding:13px;border:1px solid #cbd8e5;border-radius:12px;font:inherit;background:#fff}
.primary,.send{width:100%;padding:14px;border:0;border-radius:12px;background:#1e6ba8;color:#fff;font-weight:800;cursor:pointer;font-family:inherit}
.primary:disabled,.send:disabled{opacity:.5;cursor:not-allowed}
.field{margin:11px 0}.field label{display:block;margin-bottom:5px;color:#607286;font-size:13px}
header{background:linear-gradient(135deg,#164b7c,#1f6aa7);color:#fff;padding:16px}
.headrow{display:flex;justify-content:space-between;align-items:center}
.logout{background:#ffffff18;color:#fff;border:1px solid #ffffff55;border-radius:9px;padding:8px;cursor:pointer;font-family:inherit}
.content{padding:14px}
.create{width:100%;border:0;border-radius:17px;padding:20px;background:linear-gradient(135deg,#248bd2,#185893);color:#fff;text-align:left;font-size:19px;font-weight:900;cursor:pointer;font-family:inherit}
.create small{display:block;font-size:12px;margin-top:4px}
.section{border:1px solid #dce5ee;border-radius:16px;margin-top:14px;overflow:hidden}
.section h2{font-size:17px;color:#173d62;padding:14px;margin:0;border-bottom:1px solid #e5edf4}
.filters,.actions,.range,.format{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.filters button{border:1px solid #cbdbe9;border-radius:10px;padding:11px;background:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.filters button.on{background:#173d62;color:#fff}
.hdr,.row{display:grid;grid-template-columns:34px 1fr 74px 80px;gap:3px}
.hdr{padding:9px;background:#f0f5f9;font-size:11px;text-align:center}
.item{padding:11px;border-top:1px solid #edf1f5}
.row .date{text-align:center;font-size:11px}.work{font-weight:700}
.meta{font-size:11px;color:#8a9bab;margin:6px 0 7px 34px}
.item-actions{display:grid;grid-template-columns:1fr 1fr 43px 43px;gap:7px;margin-left:34px}
.item-actions button{padding:8px;border-radius:9px;border:1px solid #cbd8e5;background:#f7fafc;cursor:pointer;font-family:inherit}
.weekly.on{background:#e3f1ff;color:#145a93;border-color:#5b9bd5}
.pending.on{background:#fff2d9;color:#965b00;border-color:#f2b84b}
.edit-work{background:#eef7ff!important;border-color:#8ab7d8!important;color:#165f93!important;font-size:18px;font-weight:900}
.delete-work{background:#fff1f1!important;border-color:#ef9a9a!important;color:#b71c1c!important;font-size:18px;font-weight:900}
.box{padding:13px}
.sheet{position:fixed;inset:0;background:#10233888;display:flex;align-items:flex-end;z-index:20}
.panel{width:min(680px,100%);margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:17px;max-height:94vh;overflow:auto}
.panelhead{display:flex;justify-content:space-between;align-items:center}
.close{border:0;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;background:#f0f5f9}
.photo-pick{display:block;border:1px dashed #78a9ce;border-radius:11px;padding:13px;text-align:center;background:#f4faff;color:#205d8c;font-weight:800;cursor:pointer}
.photo-pick input{display:none}
.photo-help{font-size:12px;color:#789;margin-top:6px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#edf2f7}
.thumb img{width:100%;height:100%;object-fit:cover}
.del{position:absolute;right:4px;top:4px;border:0;border-radius:50%;width:27px;height:27px;background:#c62828;color:#fff;font-weight:bold;cursor:pointer}
.modal{position:fixed;inset:0;background:#10233899;display:grid;place-items:center;padding:16px;z-index:30}
.card{background:#fff;border-radius:16px;padding:17px;width:min(440px,100%)}
.summary{background:#f5f9fc;border-radius:10px;padding:12px;line-height:1.8;margin:12px 0}
.empty{text-align:center;padding:28px;color:#94a3b8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2a3a;color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
#loadingOv{position:fixed;inset:0;background:#eef4f8;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:36px;height:36px;border:3px solid #cbd8e5;border-top-color:#1e6ba8;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>

<div id="loadingOv" class="hidden">
  <div class="spinner"></div>
  <div id="loadingMsg" style="font-size:14px;color:#607286;">處理中…</div>
</div>

<div id="toastEl" class="toast"></div>

<div id="loginPage" class="login">
  <div class="login-card">
    <div class="hero">📋</div>
    <h1>東立材料_廠務行動週報</h1>
    <div class="field">
      <label>請輸入工號</label>
      <input id="empId" inputmode="numeric" placeholder="7003162">
    </div>
    <button class="primary" onclick="loginApp()">進入系統</button>
  </div>
</div>

<div id="app" class="app hidden">
  <header>
    <div class="headrow">
      <div><b>東立材料_廠務行動週報</b><div id="userText"></div></div>
      <button class="logout" onclick="location.reload()">登出</button>
    </div>
  </header>
  <main class="content">
    <button class="create" onclick="openCreate()">＋ 建立工作事項<small>記錄工作內容、日期、備註與現場照片</small></button>
    <section class="section">
      <h2>所有工作清單 <span id="count"></span></h2>
      <div class="filters">
        <button class="on" onclick="filterList(this,14)">最近 2 週＋未完成</button>
        <button onclick="filterList(this,30)">最近 1 個月＋未完成</button>
      </div>
      <div class="hdr"><span>項次</span><span>工作內容</span><span>完成日期</span><span>預定日期</span></div>
      <div id="list"></div>
    </section>
    <section class="section">
      <h2>匯出與寄送週報</h2>
      <div class="box">
        <b>本週工作週報日期範圍</b>
        <div class="range">
          <div class="field"><label>開始日期</label><input id="from" type="date"></div>
          <div class="field"><label>結束日期</label><input id="to" type="date"></div>
        </div>
        <div class="format">
          <label><input type="radio" name="fmt" value="pdf" checked> PDF</label>
          <label><input type="radio" name="fmt" value="xlsx"> Excel</label>
        </div>
        <div class="actions">
          <button class="primary" onclick="downloadReport()">下載週報</button>
          <button class="send" onclick="previewSend()">寄送週報預覽</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="createSheet" class="sheet hidden">
  <div class="panel">
    <div class="panelhead">
      <h2 id="formTitle">建立工作事項</h2>
      <button class="close" onclick="closeCreate()">×</button>
    </div>
    <div class="field"><label>工作內容</label><textarea id="workText" rows="5" placeholder="可多行輸入，換行會保留到週報"></textarea></div>
    <div class="field"><label>日期狀態</label>
      <select id="dateMode" onchange="dateModeChanged()">
        <option value="today">當日完成</option>
        <option value="actual">完成日期</option>
        <option value="planned">預定完成日期</option>
        <option value="none">尚無日期</option>
      </select>
    </div>
    <div id="dateBox" class="field"><label id="dateLabel">完成日期</label><input id="workDate" type="date"></div>
    <div class="field"><label>備註</label><input id="remark" placeholder="選填"></div>
    <div id="photoArea" class="field">
      <label>現場照片（自動壓縮，最多 3 張）</label>
      <label class="photo-pick">📷 選取照片或使用相機
        <input id="photoInput" type="file" accept="image/*" multiple onchange="selectPhotos(event)">
      </label>
      <div class="photo-help">可一次多選或重複加入；縮圖右上角可刪除。</div>
      <div id="thumbs" class="thumbs"></div>
    </div>
    <button id="saveBtn" class="primary" onclick="saveForm()">儲存工作事項</button>
  </div>
</div>

<div id="sendModal" class="modal hidden">
  <div class="card">
    <h2>寄送週報預覽</h2>
    <div id="summary" class="summary"></div>
    <div class="actions">
      <button class="primary" onclick="closePreview()">返回修改</button>
      <button class="send" onclick="confirmSend()">確認寄送</button>
    </div>
  </div>
</div>

<script>
// ── 設定 ──────────────────────────────────────────────────────
const GAS_URL='https://script.google.com/macros/s/AKfycbw228c9_wyGChUXZb7Ag7ZS1_oRxCeJrBKOSrgY3YxZSIy4sIesBpsiBmcVzUemPfud/exec';

// ── 狀態 ──────────────────────────────────────────────────────
let session=null, works=[], days=14, photos=[], editingId='', editingSection='pending';
const MAX_PHOTOS=3;
const $=id=>document.getElementById(id);

// ── API 呼叫（取代 google.script.run）────────────────────────
async function api(action, params={}){
  const res=await fetch(GAS_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action,...params})
  });
  const j=await res.json();
  if(!j.ok) throw new Error(j.error||'操作失敗');
  return j.result;
}

// ── Loading / Toast ────────────────────────────────────────
let _loadingCount=0;
function showLoading(msg){
  _loadingCount++;
  $('loadingMsg').textContent=msg||'處理中…';
  $('loadingOv').classList.remove('hidden');
}
function hideLoading(){
  _loadingCount=Math.max(0,_loadingCount-1);
  if(_loadingCount===0) $('loadingOv').classList.add('hidden');
}
let _tt;
function toast(msg,dur){
  const t=$('toastEl');
  clearTimeout(_tt);
  t.textContent=msg; t.classList.add('show');
  _tt=setTimeout(()=>t.classList.remove('show'),dur||2400);
}

// ── 初始化 ──────────────────────────────────────────────────
function init(){
  let e=new Date(); e.setDate(e.getDate()-1);
  let s=new Date(e); s.setDate(e.getDate()-6);
  $('from').value=iso(s); $('to').value=iso(e);
  $('workDate').value=iso(new Date());
}
function iso(d){
  return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}

// ── 登入 ──────────────────────────────────────────────────
async function loginApp(){
  const empId=$('empId').value.trim();
  if(!empId){toast('請輸入工號');return;}
  showLoading('驗證中…');
  try{
    session=await api('login',{empId});
    $('loginPage').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('userText').textContent=`${session.reporter}｜${session.department}｜${session.empId}`;
    loadWorks();
  }catch(e){toast('❌ '+e.message);}
  finally{hideLoading();}
}

// ── 工作清單 ────────────────────────────────────────────────
async function loadWorks(){
  showLoading('載入中…');
  try{works=await api('getWorks',{days}); render();}
  catch(e){toast('❌ 載入失敗：'+e.message);}
  finally{hideLoading();}
}
function render(){
  if(!works.length){$('list').innerHTML='<div class="empty">目前沒有工作事項</div>';$('count').textContent='0 項';return;}
  $('count').textContent=works.length+' 項';
  $('list').innerHTML=works.map((w,i)=>
    '<div class="item"><div class="row"><span>'+(i+1)+'</span><span class="work">'+esc(w.work_content)+'</span><span class="date">'+(w.actual_date||'－')+'</span><span class="date">'+(w.planned_date||'－')+'</span></div>'
    +'<div class="meta">建立：'+String(w.created_at||'').slice(0,10)+'</div>'
    +'<div class="item-actions">'
    +'<button class="weekly '+(w.report_section==='weekly'?'on':'')+'" data-id="'+escAttr(w.id)+'" data-action="weekly">● 本週週報</button>'
    +'<button class="pending '+(w.report_section==='pending'?'on':'')+'" data-id="'+escAttr(w.id)+'" data-action="pending">● 待安排執行事項</button>'
    +'<button class="edit-work" data-id="'+escAttr(w.id)+'" data-action="edit">✎</button>'
    +'<button class="delete-work" data-id="'+escAttr(w.id)+'" data-action="delete">×</button>'
    +'</div></div>'
  ).join('');
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function escAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const id=b.dataset.id,a=b.dataset.action;
  if(a==='weekly'||a==='pending') setSection(id,a);
  else if(a==='delete') deleteItem(id);
  else if(a==='edit') openEdit(id);
});

function filterList(btn,n){
  document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on'); days=n; loadWorks();
}
async function setSection(id,section){
  try{await api('updateSection',{id,section}); loadWorks();}
  catch(e){toast('❌ '+e.message);}
}
async function deleteItem(id){
  const x=works.find(w=>String(w.id)===String(id));
  if(!confirm('確定要刪除這筆工作事項？\n\n'+(x?x.work_content:'')))return;
  showLoading('刪除中…');
  try{await api('deleteWork',{id}); loadWorks(); toast('✅ 已刪除工作事項');}
  catch(e){toast('❌ '+e.message);}
  finally{hideLoading();}
}

// ── 表單 ─────────────────────────────────────────────────────
function openCreate(){resetForm();$('createSheet').classList.remove('hidden');}
async function openEdit(id){
  showLoading('載入資料…');
  try{
    const x=await api('getWorkForEdit',{id});
    editingId=x.id; editingSection=x.reportSection||'pending';
    $('workText').value=x.workContent||'';
    $('remark').value=x.remark||'';
    if(x.actualDate){$('dateMode').value='actual';$('workDate').value=x.actualDate;}
    else if(x.plannedDate){$('dateMode').value='planned';$('workDate').value=x.plannedDate;}
    else{$('dateMode').value='none';$('workDate').value='';}
    dateModeChanged();
    $('formTitle').textContent='修改工作事項';
    $('saveBtn').textContent='儲存修改';
    $('photoArea').classList.add('hidden');
    $('createSheet').classList.remove('hidden');
  }catch(e){toast('❌ '+e.message);}
  finally{hideLoading();}
}
function closeCreate(){$('createSheet').classList.add('hidden');resetForm();}
function resetForm(){
  editingId=''; editingSection='pending'; photos=[];
  $('workText').value=''; $('remark').value='';
  $('dateMode').value='today'; $('workDate').value=iso(new Date());
  $('formTitle').textContent='建立工作事項';
  $('saveBtn').textContent='儲存工作事項';
  $('photoArea').classList.remove('hidden');
  renderThumbs(); dateModeChanged();
}
function dateModeChanged(){
  const m=$('dateMode').value;
  $('dateBox').classList.toggle('hidden',m==='none');
  $('dateLabel').textContent=m==='planned'?'預定完成日期':'完成日期';
  if(m==='today')$('workDate').value=iso(new Date());
}

// ── 照片 ──────────────────────────────────────────────────
async function selectPhotos(e){
  for(const f of [...e.target.files]){
    if(photos.length>=MAX_PHOTOS){toast('單筆最多 3 張照片');break;}
    photos.push({name:f.name,dataUrl:await compress(f)});
  }
  e.target.value=''; renderThumbs();
}
function renderThumbs(){
  $('thumbs').innerHTML=photos.map((p,i)=>'<div class="thumb"><img src="'+p.dataUrl+'"><button class="del" type="button" onclick="removePhoto('+i+')">×</button></div>').join('');
}
function removePhoto(i){photos.splice(i,1);renderThumbs();}
async function compress(file){
  const img=await new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file);});
  const sc=Math.min(1,1280/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let q=.82,u=c.toDataURL('image/jpeg',q);
  while(u.length*.75>350*1024&&q>.42){q-=.07;u=c.toDataURL('image/jpeg',q);}
  return u;
}

// ── 儲存 ──────────────────────────────────────────────────
async function saveForm(){
  const content=$('workText').value.trim();
  if(!content){toast('請輸入工作內容');return;}
  $('saveBtn').disabled=true;
  showLoading(editingId?'儲存修改中…':'儲存中…');
  try{
    if(editingId){
      await api('updateWork',{id:editingId,workContent:content,dateMode:$('dateMode').value,workDate:$('workDate').value,remark:$('remark').value,reportSection:editingSection});
      closeCreate(); loadWorks(); toast('✅ 修改完成');
    }else{
      await api('saveWork',{empId:session.empId,reporter:session.reporter,department:session.department,workContent:content,dateMode:$('dateMode').value,workDate:$('workDate').value,remark:$('remark').value,photos});
      closeCreate(); loadWorks(); toast('✅ 已儲存');
    }
  }catch(e){toast('❌ '+e.message,3500);}
  finally{$('saveBtn').disabled=false; hideLoading();}
}

// ── 匯出 / 寄送 ───────────────────────────────────────────
function getFormat(){return document.querySelector('[name=fmt]:checked').value;}
async function previewSend(){
  showLoading('產生預覽…');
  try{
    const x=await api('getSendPreview',{from:$('from').value,to:$('to').value,format:getFormat()});
    $('summary').innerHTML=`期間：<b>${x.from}～${x.to}</b><br>報告人：${x.reporter}<br>部門：${x.department}<br>格式：${x.format}<br>本週完成：${x.weekly} 項<br>待安排執行事項：${x.pending} 項<br>照片：${x.photos} 張<br>收件者：${x.toEmail}`;
    $('sendModal').classList.remove('hidden');
  }catch(e){toast('❌ '+e.message);}
  finally{hideLoading();}
}
function closePreview(){$('sendModal').classList.add('hidden');}
async function confirmSend(){
  closePreview();
  showLoading('寄送中，請稍候…');
  try{
    await api('sendReport',{from:$('from').value,to:$('to').value,format:getFormat()});
    toast('✅ 週報已寄送');
  }catch(e){toast('❌ '+e.message,4000);}
  finally{hideLoading();}
}
async function downloadReport(){
  if(!$('from').value||!$('to').value){toast('請選擇日期範圍');return;}
  showLoading('產生週報中，請稍候（約 10-20 秒）…');
  try{
    const x=await api('downloadReport',{from:$('from').value,to:$('to').value,format:getFormat()});
    const a=document.createElement('a');
    a.href=`data:${x.mimeType};base64,${x.base64}`;
    a.download=x.name; a.click();
    toast('✅ 已下載：'+x.name);
  }catch(e){toast('❌ '+e.message,4000);}
  finally{hideLoading();}
}

init();
</script></body></html>
